const DOCS = {"active-context.md": "# Active context\n\n_Keep this current: the live working state for the next session._\n\n## Now\n\n## Next\n\n## Open decisions\n", "architecture.md": "# Architecture\n\n## Stack & versions\n\nBrownfield target: `Rapidtackltd/humanos-backend-services` at assessed commit\n`79a38ade1fc0163cadf39ae3cccd466b7f8d5d9d` — Java/Spring Boot monorepo with\nMaven modules, PostgreSQL (Flyway migrations), and a YAML bootstrap model registry.\nAssessed components: `ai-execution-service` (single model-call service; sync\n`POST /api/ai/executions` + DB-backed async job dispatcher), `humanos-ai-client`\n(provider-neutral shared client), `workflow-engine/runtime-ai/gateway` (governed AI\nenvelope: schema, evidence/citation, confidence, autonomy, budget — strong reuse,\nAUD-003). Exact toolchain versions are read from the repo when work starts\n(OI-01 — this plan was authored from the handoff package, not a local checkout).\n\n## Repo layout (target A-01 shape inside the existing monorepo)\n\n- `humanos-ai-contracts/` — NEW versioned contract module (M02): request/result,\n  route lineage, canonical failure taxonomy.\n- `ai-execution-service/` — RETAINED single choke point (AUD-001): router (M09),\n  registry (M07), qualification enforcement (M08), credential resolution (M05),\n  lineage persistence (M10), connectors (M15).\n- `endpoint-ai-runtime-broker/` — NEW managed-endpoint component extracted from the\n  in-process Claude CLI adapter (M04); owns subscription-CLI/local-runtime execution.\n- `humanos-ai-client/` — RETAINED caller boundary; migrated to contracts v1 (M02, M11).\n- Development AI workflow assets (M12–M14): Codex read-only reviewer wrapper, Fable/Opus\n  task profiles, protected-branch CI + CODEOWNERS + named-human merge gate.\n\n## Components & data flow\n\ncaller service → `humanos-ai-client` (contracts v1) → `ai-execution-service`:\ncredential resolution (provider-scoped, T05) → hard eligibility filter\n(policy/region/features/qualification/health, T08) → minimum-sufficient selection →\nconnector (Anthropic native / OpenAI native / constrained compatible) OR delegation to\nthe Endpoint AI Runtime Broker (T04) → result with exact route lineage (T10) →\nevidence-object persistence (T06) + durable audit ledger (M18). Failures resolve through\nthe canonical taxonomy to fallback / human-review / no-AI terminals (T09).\n\n## API contracts\n\n`humanos-ai-contracts` v1 is the one wire contract (T03); the runtime gateway's governed\nenvelope promotes a policy-safe subset into `AIJobRequest` while the workflow runtime\nkeeps final validation authority (AUD-003 \"reuse, do not rebuild\"). Registry/catalogue\nendpoints are authenticated or minimised (M17). Schemas/events are versioned with\ncompatibility addressed (constitution DoD-4).\n\n## Persistence & migrations\n\nPostgreSQL + Flyway. The raw prompt/output columns (V1 migration, AUD-018) are replaced\nby minimised metadata plus encrypted classified evidence-object references (M06) via a\nforward migration with retention/correction/deletion/hold tests. Mandatory audit events\nride a durable outbox with reconciliation (M18); the model-deployment registry and\nqualification tables are new schema (M07, M08).\n\n## Conventions (errors, logging, validation)\n\nCanonical A-01 error taxonomy separates provider diagnostics from user-safe messages\n(AUD-019). Logs/traces carry only approved operational metadata — never prompts, outputs\nor provider error bodies (DoD-5, AUD-013). Tenant isolation: audience-scoped service\nidentity with purpose claims and principal reconciliation on S2S paths (AUD-016).\n\n## Build / test / lint commands (verification-loop)\n\nPer assessed component, from the monorepo root (confirm against the checkout — OI-01):\n\n- Build+test one module: `mvn -pl <module> -am test`\n- Full verification: `mvn verify`\n- Dependency/provider scan (M11 acceptance): repository dependency scan proving no\n  provider SDK/config import outside approved connector modules, plus the removal diff.\n- Each module's spec names its own required evidence class (contract fixtures, negative\n  routing tests, failure-injection, migration/privacy/DR tests, permission/injection\n  tests, repository control tests) per the Remediation Sequence's \"Required evidence\".\n\n## Build tooling\n\nImplementer/reviewer routing per module front-matter (`model:` / `reviewer:`), executed\nthrough the plugin's orchestrate/review loop; the programme itself also BUILDS that\nseparation as product (M12–M14) — the dev workflow the plan uses and the one it ships\nmust end up being the same thing (T11).\n\n## Decisions (ADRs)\n\n- **ADR-P1 (baseline)**: Retain `ai-execution-service` + `humanos-ai-client` as the\n  central gateway foundation; extend in place, never build a competing orchestrator.\n  Context: AUD-001/AUD-003. Consequence: all P0 work lands inside the existing modules\n  except the new contracts module and the extracted endpoint broker.\n- **ADR-P2 (baseline)**: The standalone router is a decision spike (REM-022), built only\n  if isolation/resilience/customer-deployment needs cannot be met centrally — CTO owns\n  the decision (M21, blocked-needs-decision).\n- Further ADRs are recorded in `registers/decisions.md` as they are accepted.\n", "constitution.md": "# Constitution — non-negotiables (inherited verbatim by every handoff)\n\n## Source-of-truth hierarchy (AI Coding Handoff, master workbook)\n\n1. Accepted ADRs and non-negotiable rules override older prompts and placeholders.\n2. Stage/domain contracts define terminology, interfaces and required behaviour.\n3. Repository assessment/audit/evidence sheets describe current code reality.\n4. The remediation sequence and Stage 12 backlog define implementation order.\n5. Gate/test sheets define completion; an AI statement or build success alone is\n   insufficient.\n6. Earlier stage workbooks and prompts are historical snapshots; the latest master\n   workbook wins every conflict.\n\n## Definition of done (every work package)\n\n1. Acceptance criteria implemented and mapped to deterministic tests.\n2. Required unit, contract, integration, migration, security/privacy and failure tests pass.\n3. No provider, credential, tenant, evidence, review or employee-rights boundary is weakened.\n4. Schemas/events are versioned and compatibility is addressed.\n5. Logs/traces contain only approved operational metadata.\n6. Codex blockers/majors are resolved or human-adjudicated.\n7. CI passes and a named human approves the merge.\n8. Workbook status/evidence/source/commit rows are updated with actual results.\n\n## Hard boundaries (violating any of these is a stop, not a trade-off)\n\n- No central or background workload may ever select a user's subscription CLI; endpoint\n  subscription/local runtimes execute only behind the Endpoint AI Runtime Broker, and the\n  central service never touches user-local OAuth (T02, T04).\n- No silent material route change: tenant→platform account, provider, region, model or\n  qualification substitutions are explicit, policy-checked and audited (T05, T09).\n- No raw AI prompt/output persistence in domain stores; classified, encrypted\n  evidence-object references only, with retention/correction/deletion/hold lineage (T06).\n- Every active route names an exact model deployment (never a family/alias alone) and only\n  qualified, unexpired task×effort configurations may be selected (T07, T08).\n- Development AI separation of duties: Fable plans (no code writes), Opus implements\n  (no self-review/merge), Codex reviews read-only (no write tools), CI plus a named human\n  gate every protected merge (T11).\n- AI cannot directly decide dismissal, pay, promotion, probation or discipline; AI\n  unavailability never becomes employee failure (T12, T09).\n- The Stage 12A hardening gate passes before any real employee pilot (T13).\n\n## Planning method (spec-driven-planning)\n\n- Provenance before assertion; never invent a domain, provider or regulatory fact — no\n  dated source means an open-item, not a guess.\n- The trigger checklist beats the label; default to the higher tier.\n- Modular by construction: single responsibility, interface-only interaction, acyclic\n  dependencies, independently testable, agent-sized units.\n- Status lives only in module front-matter; board/index/traceability are derived and\n  regenerated, never hand-edited.\n- Reconcile after every build wave; a Tier-0 module is not `implementation-verified`\n  without a recorded independent dual-review verdict.\n- A green lint is a structural check, never a compliance verdict.\n", "overview.md": "# Overview — HumanOS Work Intelligence: Remediation & Qualification Programme\n\n## Outcomes\n\nBring `Rapidtackltd/humanos-backend-services` from its assessed 25.4% alignment with\nArchitecture Amendment A-01 to a state where the Stage 12A hardening gate can be executed:\nevery P0 remediation item (REM-001..REM-014, REM-023) closed with its required evidence,\nthe P1 hardening set (REM-015..REM-021) delivered, the Fable–Opus–Codex development AI\nworkflow built and qualified, and the staged internal pilot unblocked — without weakening\nany provider, credential, tenant, evidence, review or employee-rights boundary.\n\n## Scope boundaries\n\n- IN: the A-01 AI platform remediation inside the existing monorepo — contracts, gateway,\n  endpoint broker, credential resolution, evidence persistence, model registry,\n  qualification, routing/fallback, lineage, connectors, dev-AI workflow, CI merge gate,\n  Stage 12A assurance tracks, pilot protocol readiness.\n- OUT: rebuilding the retained foundations (`ai-execution-service`, `humanos-ai-client`\n  are retained and extended — AUD-001); the wider Work Intelligence capture/assurance\n  product stages (0–11 are specified in the master workbook and not re-planned here);\n  any real employee pilot before the Stage 12A gate passes.\n\n## Status\n\nPlanning baseline created 2026-09-14 from the complete handoff package\n(`nessovo_humanos_work_intelligence_complete_handoff`). Formal programme decision at\nbaseline: **REMEDIATE BEFORE QUALIFICATION**. All remediation modules are `draft`\n(every REM item is Open / every HND package is Not Started in the master workbook);\nnothing is in progress or verified. Two modules are `blocked-needs-decision`\n(standalone-router spike — CTO decision; pilot execution — gated on Stage 12A).\n\n## Key principles\n\n- The master workbook (`01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx`)\n  is the single authoritative source; this plan tree is its executable decomposition and\n  carries sheet-level provenance on every module.\n- Work one bounded package at a time; never claim a pass without the required evidence\n  (AI Coding Handoff, definition-of-done conditions 1–8).\n- Retain and extend the existing gateway foundation; do not build a competing orchestrator\n  (AUD-001, AUD-003).\n", "progress.commentary.md": "<!-- source: progress.commentary.md — append wave recaps THERE, not here -->\n", "progress.md": "# Progress — intelligence\n\n**Derived by `plan_lint.py --board` — this whole file regenerates; never hand-edit it. Wave-recap notes go in `progress.commentary.md` (this reads that file, never rewrites it).**\n\nOverall: **0/22 verified** · 0 in flight · 2 blocked · 20 not started\n\n## Done — implementation-verified (0)\n\n_none_\n\n## In flight (0)\n\n_none_\n\n## Blocked / needs attention (2)\n\n- W5 · **M21** Standalone router decision spike — blocked-needs-decision\n- W6 · **M22** Pilot protocol readiness — blocked-needs-decision\n\n## Not started (20)\n\n- W1 · **M01** Disable central CLI defaults — draft\n- W1 · **M02** humanos-ai-contracts v1 — draft\n- W1 · **M03** Claude CLI process safety — draft\n- W2 · **M04** Endpoint AI Runtime Broker — draft\n- W2 · **M05** Provider-scoped credential resolution — draft\n- W2 · **M06** Evidence-object persistence (no raw prompts) — draft\n- W2 · **M07** Exact model-deployment registry — draft\n- W3 · **M08** Qualification lifecycle & hard gate — draft\n- W3 · **M09** Eligibility router & canonical fallback — draft\n- W3 · **M10** Complete inference lineage — draft\n- W3 · **M11** Monorepo provider cutover — draft\n- W3 · **M12** Codex read-only review wrapper — draft\n- W3 · **M13** Fable & Opus development task profiles — draft\n- W4 · **M14** CI + named-human merge gate — draft\n- W4 · **M15** Provider connectors (native + constrained compatible) — draft\n- W4 · **M16** Provider health, budgets & circuit breaking — draft\n- W4 · **M17** Model catalogue endpoint security — draft\n- W4 · **M18** Durable audit ledger & quality feedback — draft\n- W5 · **M19** Qualification corpus & initial runs — draft\n- W5 · **M20** Stage 12A assurance execution — draft\n\n## Commentary\n<!-- source: progress.commentary.md — append wave recaps THERE, not here -->\n\n<!-- source: progress.commentary.md — append wave recaps THERE, not here -->\n", "research.md": "# Research (Phase 0) — findings & open unknowns\n\nCorpus: the complete handoff package in this folder\n(`nessovo_humanos_work_intelligence_complete_handoff/`), ingested as source data\n(untrusted until cross-checked against the master workbook, which the package itself\nnames as the single authority). Full sheet inventory: ~240 sheets across Stages 0–12,\nthe A-01 AI amendment, and the Stage 12A execution set.\n\n## What exists and is reusable (brownfield)\n\n- `ai-execution-service` is explicitly the single model-call service and\n  `humanos-ai-client` centralises callers — retained as the core foundation\n  (AUD-001, alignment 0.65, \"Implemented — unverified\").\n- Sync execution API (`POST /api/ai/executions`, AUD-004, 0.65) and a DB-backed async\n  job lifecycle (AUD-005, 0.55) exist in code but have no executed integration evidence.\n- The workflow runtime's governed AI envelope (schema, evidence/citation, confidence,\n  autonomy, budget) is a strong reuse seam (AUD-003, 0.55): promote a policy-safe subset\n  into the gateway contract; do not rebuild.\n- Anthropic native connector is a good Tier-1 foundation (AUD-013, 0.5).\n\n## What is defective or missing (drives the module set)\n\n- All configured task types default to the machine's `claude-cli` subscription\n  (AUD-009, 0.05) — immediate configuration remediation (M01).\n- Contract is materially below A-01 (AUD-002, 0.35) — new `humanos-ai-contracts` v1 (M02).\n- CLI adapter: in-process, no endpoint boundary (AUD-010, 0.0) and concrete process\n  defects — `cmd.exe /c`, inherited env, no project root, stderr/timeout defect\n  (AUD-011, 0.0) — M03 then extraction M04.\n- Credential resolver is Anthropic-specific with silent platform-key fallback\n  (AUD-015, 0.2) — M05.\n- Raw prompts/outputs are mandatory append-only DB columns (AUD-018, 0.0) — M06.\n- Registry is family/alias-level YAML (AUD-006, 0.25; AUD-020, 0.0) — M07, M10.\n- Router is pin-or-static-default with no eligibility model (AUD-008, 0.15) — M08/M09.\n- No canonical failure taxonomy (AUD-019, 0.3) — M09.\n- OpenAI-compatible connector is capability-limited; parity must not be assumed\n  (AUD-014, 0.25) — M15. Tool calling via the CLI is prompt-simulated, dev/test only —\n  never qualified for production (AUD-012, 0.1) — constraint on M08/M19.\n- Tenant isolation on pure S2S paths lacks principal reconciliation (AUD-016, 0.35) —\n  folded into M02/M11 acceptance plus Stage 12A security track (M20).\n- Development AI workflow readiness is 4% — M12/M13/M14/M19.\n\n## Programme numbers at baseline (Stage 12A Repo Assessment)\n\nAlignment 25.4% overall (boundary/client 0.55, registry/routing 0.12,\nproviders/credentials 0.30, data/audit 0.20, endpoint CLI 0.05, development workflow\n0.00); 26 controls assessed, 17 critical findings, 15 P0 + 7 P1 remediation items,\nStage 12A gate execution readiness 11.1%; decision **REMEDIATE BEFORE QUALIFICATION**.\n\n## Open unknowns (tracked in registers/open-items.md)\n\n- OI-01: exact repo toolchain/build commands — the repo is not checked out beside this\n  plan; verify `mvn` module names and CI layout at build start.\n- OI-02: REM-022 standalone-router decision is the CTO's; the spike is specified but\n  gated (M21).\n- OI-03: Stage 12A human gates (DPIA/legal/worker consultation, pen-test) have owners\n  outside engineering; module M20 sequences engineering evidence but cannot close them.\n- OI-04: qualification corpus content (HumanOS + development datasets, REM-021) needs\n  the evaluation lead's sign-off before initial runs count (M19).\n", "traceability.md": "# Traceability (DERIVED - do not hand-edit)\n\n| Module | Tier | Status | Verification | Satisfies | Compliance |\n|--------|------|--------|--------------|-----------|------------|\n| M01 | 0 | draft | yes | T02 | - |\n| M02 | 0 | draft | yes | T03 | - |\n| M03 | 0 | draft | yes | T04 | - |\n| M04 | 0 | draft | yes | T04 | - |\n| M05 | 0 | draft | yes | T05 | - |\n| M06 | 0 | draft | yes | T06 | - |\n| M07 | 0 | draft | yes | T07 | - |\n| M08 | 0 | draft | yes | T08 | - |\n| M09 | 0 | draft | yes | T08, T09 | - |\n| M10 | 0 | draft | yes | T10 | - |\n| M11 | 0 | draft | yes | T01 | - |\n| M12 | 1 | draft | yes | T11 | - |\n| M13 | 1 | draft | yes | T11 | - |\n| M14 | 0 | draft | yes | T11 | - |\n| M15 | 1 | draft | yes | T01 | - |\n| M16 | 1 | draft | yes | T08 | - |\n| M17 | 1 | draft | yes | T07 | - |\n| M18 | 1 | draft | yes | T10 | - |\n| M19 | 1 | draft | yes | T08, T11 | - |\n| M20 | 0 | draft | yes | T13 | - |\n| M21 | 2 | blocked-needs-decision | yes | - | - |\n| M22 | 0 | blocked-needs-decision | yes | T12, T13 | - |\n\n## Orphan truths (no covering module)\n\n_none — every declared truth maps to a module_\n", "truths.md": "# Truths (invariants)\n\nEach: id, statement, evidence/source, effective-date. Sources are sheets of the master\nworkbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx`\n(the package's declared single authority) unless stated otherwise. Effective-date is the\nplan baseline, 2026-09-14 — the handoff package was received 2026-07-21.\n\n- **T01** — All provider model calls pass through the single central AI execution choke\n  point (`ai-execution-service` via `humanos-ai-client`); no service outside approved\n  connector modules imports provider SDKs or sends provider HTTP requests.\n  Evidence: AUD-001 (positive foundation, 0.65), REM-023, HND-001. 2026-09-14.\n- **T02** — No central/default task route may select the machine's logged-in Claude CLI\n  subscription; CLI use requires an explicit endpoint-interactive development profile.\n  Evidence: AUD-009 (all configured task types default to `claude-cli` — critical),\n  REM-001. 2026-09-14.\n- **T03** — The provider-neutral contract `humanos-ai-contracts` v1 carries purpose,\n  task/effort profile, data class, region, features, output schema, evidence refs,\n  review policy, fallback and exact route lineage on request AND result.\n  Evidence: REM-002, HND-002, AUD-002 (current contract limited to\n  taskType/input/model/maxTokens/temperature). 2026-09-14.\n- **T04** — Endpoint subscription CLIs and local runtimes are invoked only by the\n  Endpoint AI Runtime Broker at the managed endpoint boundary; the central service never\n  accesses user-local OAuth. Evidence: REM-004, AUD-010 (missing A-01 boundary, 0.0).\n  2026-09-14.\n- **T05** — Credential resolution is provider-scoped with explicit\n  configured/not-found/unavailable/forbidden outcomes; a tenant-service outage can never\n  silently switch to a platform key, account, provider or data route.\n  Evidence: REM-005, AUD-015 (silent fallback today — P0 privacy/billing gap). 2026-09-14.\n- **T06** — No raw AI prompt/output is persisted in domain stores: minimised metadata plus\n  encrypted, classified evidence-object references with TTL, access grants, correction,\n  deletion and legal-hold lineage. Evidence: REM-006, AUD-018 (raw columns mandatory\n  append-only today — incompatible), HND-005. 2026-09-14.\n- **T07** — Every active route is represented by an exact model deployment\n  (endpoint/operator/snapshot-or-digest/runtime/CLI/quantisation/context/features/terms/\n  region/price/lifecycle) — never a family or alias alone.\n  Evidence: REM-007, AUD-006 (0.25), AUD-020 (0.0). 2026-09-14.\n- **T08** — Only qualified, unexpired task×effort execution configurations can be\n  selected; hard eligibility (policy/region/features/qualification/health) is applied\n  before minimum-sufficient cost/latency selection, and cost can never make an ineligible\n  route eligible. Evidence: REM-008, REM-009, AUD-008 (0.15). 2026-09-14.\n- **T09** — Failures follow the canonical A-01 error/fallback taxonomy\n  (auth/quota/model/region/schema/qualification/resource/no-route/user-action) with\n  terminal human-review/no-AI paths; no silent material route change, and AI\n  unavailability never becomes employee failure. Evidence: REM-010, AUD-019. 2026-09-14.\n- **T10** — 100% of material AI-assisted domain records carry complete inference lineage:\n  actual implementation, connector, provider/operator, requested vs actual model, runtime,\n  qualification profile, region, fallback and review references.\n  Evidence: REM-011, HND-008, AUD-017/AUD-020. 2026-09-14.\n- **T11** — Development AI separation of duties: the Fable profile plans/integrates and\n  cannot execute coding writes; the Opus profile implements and cannot self-review or\n  merge; Codex reviews read-only (no write tools); a protected-branch merge requires\n  deterministic CI, Codex blocker/major resolution and a named human approval.\n  Evidence: REM-012, REM-013, REM-014, HND-009, Development AI Workflow /\n  Claude-Codex Review Protocol sheets. 2026-09-14.\n- **T12** — AI cannot directly decide dismissal, pay, promotion, probation or discipline;\n  employees can inspect, correct, dispute and appeal material findings.\n  Evidence: README_FIRST.md \"What the project does\" §8/§10; Governance sheet. 2026-09-14.\n- **T13** — The Stage 12A hardening gate (security, privacy/DPIA, legal/worker\n  consultation, endpoint performance, data reliability/DR, AI & evaluator evaluation,\n  fairness, accessibility) passes or restricts before any real employee pilot.\n  Evidence: Stage 12A Remediation Sequence preamble (\"P0 work must precede model\n  qualification and any real employee pilot\"), Stage 12A/12B gate sheets, HND-010.\n  2026-09-14.\n", "waves.md": "# Waves — sequence & dependency map\n\nP0 work precedes model qualification and any real employee pilot (Stage 12A Remediation\nSequence preamble, T13). Order follows the sequence's declared dependencies.\n\n## Wave 1 — stop the bleeding + the contract (no dependencies)\n\n- M01 Disable central CLI defaults (Tier 0, 1d) — first change of the programme.\n- M02 humanos-ai-contracts v1 (Tier 0, 8d) — critical path for everything below.\n- M03 Claude CLI process safety (Tier 0, 5d).\n\n## Wave 2 — boundaries on the contract\n\n- M04 Endpoint AI Runtime Broker (Tier 0, 15d) ← M02, M03.\n- M05 Provider-scoped credential resolution (Tier 0, 8d) ← M02.\n- M06 Evidence-object persistence (Tier 0, 15d) ← M02.\n- M07 Exact model-deployment registry (Tier 0, 12d) ← M02.\n\n## Wave 3 — routing truth + monorepo cutover + dev-AI pieces\n\n- M08 Qualification lifecycle & hard gate (Tier 0, 20d) ← M07.\n- M09 Eligibility router & canonical fallback (Tier 0, 22d) ← M05, M07, M08, M02.\n- M10 Complete inference lineage (Tier 0, 10d) ← M02, M07, M09.\n- M11 Monorepo provider cutover (Tier 0, 12d) ← M02.\n- M12 Codex read-only review wrapper (Tier 1, 8d) ← M02, M04.\n- M13 Fable & Opus task profiles (Tier 1, 6d) ← M02, M04.\n\n## Wave 4 — enforcement & hardening\n\n- M14 CI + named-human merge gate (Tier 0, 6d) ← M12, M13.\n- M15 Provider connectors (Tier 1, 26d across three REMs) ← M02, M07.\n- M16 Health, budgets & circuit breaking (Tier 1, 10d) ← M09.\n- M17 Catalogue endpoint security (Tier 1, 3d) ← M07.\n- M18 Durable audit ledger (Tier 1, 10d) ← M10.\n\n## Wave 5 — qualification & the gate\n\n- M19 Qualification corpus & initial runs (Tier 1, 20d) ← M08, M12, M13, M15 (OI-04).\n- M20 Stage 12A assurance execution (Tier 0) ← M04, M06, M09, M11, M14 (OI-03).\n- M21 Standalone router decision spike (Tier 2, 10d if built) — blocked-needs-decision (OI-02).\n\n## Wave 6 — pilot (gated)\n\n- M22 Pilot protocol readiness (Tier 0) ← M20; blocked until the Stage 12A gate passes\n  or restricts (T13).\n", "registers/decisions.md": "# Decisions\n\n- D01 (2026-09-14, plan baseline) — Adopt the master workbook as the controlling source\n  and decompose the Stage 12A remediation sequence 1:1 into risk-tiered modules; module\n  ids carry REM/HND/AUD provenance. Rationale: the package's own source-of-truth rule.\n- D02 (2026-09-14) — ADR-P1: retain and extend `ai-execution-service` +\n  `humanos-ai-client`; no competing orchestrator (AUD-001/003).\n- D03 (2026-09-14) — ADR-P2: standalone router is a gated decision spike (REM-022),\n  not default scope (M21 blocked-needs-decision, CTO owner).\n- D04 (2026-09-14) — Plan tree + cockpit live INSIDE `D:\\intelligence` (user directive),\n  mirroring the humanos-plan-cockpit pattern; board served on port 4181 (4173 is owned\n  by the Business Hub board, 4179 by the engine/orchestration cockpit).\n", "registers/open-items.md": "# Open items\n\n- OI-01 (blocking M-build start, not spec) — Confirm monorepo toolchain: Maven module\n  names, JDK version, CI entry points, from a live checkout of\n  `humanos-backend-services`. Owner: first implementer. Raised 2026-09-14.\n- OI-02 (decision) — REM-022 standalone router build/no-build. Owner: CTO /\n  Architecture. Module M21 stays `blocked-needs-decision` until recorded. Raised\n  2026-09-14.\n- OI-03 (external gates) — Stage 12A DPIA/legal/worker-consultation and penetration\n  test are human/organisational gates with owners outside this engineering plan; M20\n  sequences engineering evidence only. Raised 2026-09-14.\n- OI-04 (data) — Qualification corpus definition (HumanOS + development datasets) needs\n  AI Evaluation Lead sign-off before REM-021 runs count (M19). Raised 2026-09-14.\n- OI-05 (verification) — AUD \"Implemented — unverified\" foundations (sync API, async\n  lifecycle) need executed integration evidence under contracts v1; folded into M02/M11\n  acceptance. Raised 2026-09-14.\n", "registers/risks.md": "# Risks\n\n- R01 — Central subscription-CLI defaults remain live while remediation proceeds:\n  every shared workload can silently bill/expose a personal account (AUD-009).\n  Mitigation: M01 is wave 1, effort 1 day, no dependencies — do it first.\n- R02 — Contract v1 (M02) is on the critical path of nearly everything; a late schema\n  break re-opens all dependents. Mitigation: versioned fixtures + compatibility tests\n  (DoD-4) before dependents start.\n- R03 — Raw prompt/output migration (M06) touches employee data and rights; a defective\n  migration is itself a privacy incident. Mitigation: migration/privacy/DR tests +\n  DPO ownership per REM-006.\n- R04 — Qualification (M08/M19) can be gamed by alias drift if exact-deployment identity\n  (M07/T07) is weakened. Mitigation: unresolved aliases shorten/disable qualification\n  (AUD-020 remediation).\n- R05 — The dev-AI workflow the programme USES (Fable/Opus/Codex) is also a deliverable\n  (M12–M14) at 4% readiness; using unqualified cells for Tier-0 work contradicts T11.\n  Mitigation: human review remains the gate on every merge until M14+M19 close.\n- R06 — Plan/board built from the handoff only; repo reality may have moved since\n  commit 79a38ade. Mitigation: OI-01 re-assessment diff at build start; treat AUD rows\n  as of that commit only.\n", "registers/sources.md": "# Sources\n\nAll paths relative to `D:\\intelligence\\nessovo_humanos_work_intelligence_complete_handoff\\nessovo_humanos_work_intelligence_complete_handoff\\`.\n\n- S01 — `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` —\n  THE single authoritative workbook (declared by README_FIRST \"Source-of-truth rule\").\n  Key sheets used: AI Coding Handoff (HND-001..010), Stage 12A Repo Assessment,\n  Stage 12A Remediation Sequence (REM-001..023), AI Execution Service Audit\n  (AUD-001..026), Development AI Readiness, Stage 12A/12B gates, AI Amendment set\n  (A-01), Governance, Risk Register. Received 2026-07-21; ingested 2026-09-14.\n- S02 — `README_FIRST.md` — plain-language system description, status numbers, first\n  engineering work list.\n- S03 — `00_START_HERE/CURRENT_STATUS_AND_NEXT_ACTIONS.md` — baseline numbers + next\n  actions 1..6.\n- S04 — `00_START_HERE/AI_CODING_IMPLEMENTATION_GUIDE.md`,\n  `00_START_HERE/PROJECT_OVERVIEW.md`, `00_START_HERE/VALIDATION_REPORT.md`,\n  `00_START_HERE/WORKBOOK_GUIDE.md` — implementation guide + package validation.\n- S05 — audited repository: `Rapidtackltd/humanos-backend-services` @\n  `79a38ade1fc0163cadf39ae3cccd466b7f8d5d9d` (evidence URLs per AUD row; the repo itself\n  is NOT vendored in this folder).\n\nRule: statements in this plan carry REM/HND/AUD/sheet ids back to S01; no provider,\nregulatory or domain fact is asserted without one.\n"};
const SPECS = {"M01": "# M01 — Disable central CLI defaults\n\n## Responsibility\n\nChange all production/default task routes away from `claude-cli`; allow it only under an explicit local-dev/endpoint-interactive profile.\n\n## Acceptance criteria\n\n- WHEN any central or background workload requests a route, THE SYSTEM SHALL never select the user-subscription CLI unless the request carries the explicit endpoint-interactive development profile.\n- WHEN the endpoint-interactive profile is absent, THE SYSTEM SHALL resolve defaults exclusively to approved connector routes.\n\n## Verification (required evidence)\n\nConfiguration + routing test (REM-001); dependency/config diff.\n\n## Provenance\n\nREM-001 · HND-001 · AUD-009 (0.05) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: 1 effort-day; no dependencies — first change of the programme (R01).", "M02": "# M02 — humanos-ai-contracts v1\n\n## Responsibility\n\nPublish the provider-neutral versioned request/result contract: purpose, task/effort, data class, region, features, output schema, evidence refs, review, fallback and exact route lineage; promote a policy-safe subset of the runtime's governed envelope; audience-scoped service identity with purpose claims on S2S paths.\n\n## Acceptance criteria\n\n- WHEN the shared client, runtime gateway and ai-execution-service exchange requests, THE SYSTEM SHALL pass versioned contract fixtures including negative cases (REM-002 acceptance).\n- WHEN a pure service-to-service request arrives, THE SYSTEM SHALL reconcile a service identity with audience and purpose claims before honouring a caller-supplied tenant (AUD-016).\n- WHEN a field the contract requires is absent, THE SYSTEM SHALL refuse the request with the canonical error taxonomy, never default it.\n\n## Verification (required evidence)\n\nSchema, compatibility and negative contract tests (HND-002); executed integration evidence for the sync API and async lifecycle under v1 (OI-05).\n\n## Provenance\n\nREM-002 · HND-002 · AUD-002 (0.35) · AUD-003 (0.55) · AUD-016 (0.35) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: Critical path (R02): M04..M13 all bind to this.", "M03": "# M03 — Claude CLI process safety\n\n## Responsibility\n\nCorrect timeout/stream handling: signed executable resolution, argument-only process (no cmd.exe /c), clean environment, approved cwd, concurrent stdout/stderr draining, process-tree kill and cancellation.\n\n## Acceptance criteria\n\n- WHEN a CLI process hangs, THE SYSTEM SHALL terminate the whole process tree within the timeout budget with no stderr deadlock.\n- WHEN the CLI is resolved, THE SYSTEM SHALL execute only a signed executable from an approved path with a clean environment and approved working directory, and SHALL NOT reach outside the approved root.\n\n## Verification (required evidence)\n\nUnit, integration, Windows/macOS and red-team tests (HND-003).\n\n## Provenance\n\nREM-003 · HND-003 · AUD-011 (0.0) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: Precondition for the broker extraction (M04).", "M04": "# M04 — Endpoint AI Runtime Broker\n\n## Responsibility\n\nExtract subscription-CLI/local-runtime invocation out of the central service into a managed endpoint boundary reporting health, action-required and canonical results.\n\n## Acceptance criteria\n\n- WHEN any central component needs endpoint execution, THE SYSTEM SHALL delegate to the broker and SHALL NOT access user-local OAuth or credentials.\n- WHEN the broker executes, THE SYSTEM SHALL report health/action-required states and return canonical contract results.\n\n## Verification (required evidence)\n\nArchitecture, integration and red-team tests (REM-004).\n\n## Provenance\n\nREM-004 · HND-003 · AUD-010 (0.0) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: 15 effort-days; the A-01 boundary AUD-010 found missing.", "M05": "# M05 — Provider-scoped credential resolution\n\n## Responsibility\n\nReplace the Anthropic-specific nullable override with an explicit provider/tenant credential result carrying configured/not-found/unavailable/forbidden and policy state; fail safely per policy.\n\n## Acceptance criteria\n\n- WHEN the tenant credential service is unavailable, THE SYSTEM SHALL fail per policy and SHALL NOT silently switch to a platform key, account, provider or data route.\n- WHEN credentials rotate, THE SYSTEM SHALL pass rotation, outage, tenant and identity tests without cross-tenant leakage.\n\n## Verification (required evidence)\n\nRotation, outage, tenant and identity tests (HND-004).\n\n## Provenance\n\nREM-005 · HND-004 · AUD-015 (0.2) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M06": "# M06 — Evidence-object persistence (no raw prompts)\n\n## Responsibility\n\nReplace mandatory raw input/output TEXT columns with minimised metadata plus encrypted, classified evidence-object references carrying TTL, access grants, correction, deletion and legal-hold lineage; forward migration for existing rows.\n\n## Acceptance criteria\n\n- WHEN a new execution is persisted, THE SYSTEM SHALL store no mandatory raw input/output text fields — only classified object references and minimised metadata.\n- WHEN retention, correction, deletion or hold events occur, THE SYSTEM SHALL propagate them across the evidence lineage and pass the privacy/DR test set.\n\n## Verification (required evidence)\n\nMigration, access, privacy and DR tests (HND-005).\n\n## Provenance\n\nREM-006 · HND-005 · AUD-018 (0.0) · DPIA-007 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: DPO co-owned (REM-006); R03.", "M07": "# M07 — Exact model-deployment registry\n\n## Responsibility\n\nRegistry rows carry endpoint, operator, snapshot-or-digest, runtime, CLI version, quantisation, context, features, terms, region, price and lifecycle; the YAML file may remain bootstrap config only.\n\n## Acceptance criteria\n\n- WHEN a route becomes active, THE SYSTEM SHALL represent it by an exact model deployment and SHALL NOT accept a family/alias-only representation.\n- WHEN a deployment alias cannot be resolved to an exact identity, THE SYSTEM SHALL shorten or disable its qualification (AUD-020).\n\n## Verification (required evidence)\n\nSchema and registry tests (REM-007).\n\n## Provenance\n\nREM-007 · HND-006 · AUD-006 (0.25) · AUD-020 (0.0) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M08": "# M08 — Qualification lifecycle & hard gate\n\n## Responsibility\n\nTask×effort qualification profiles with expiry, signed packages, shadow/canary paths and router enforcement.\n\n## Acceptance criteria\n\n- WHEN a route candidate lacks a current qualification for the task×effort cell, THE SYSTEM SHALL exclude it before selection (negative tests).\n- WHEN a qualification expires, THE SYSTEM SHALL stop selecting the configuration until requalified.\n- WHILE tool calling is prompt-simulated (AUD-012), THE SYSTEM SHALL never qualify that mode for production tool-use cells.\n\n## Verification (required evidence)\n\nQualification/routing negative tests (REM-008); registry, evaluation, shadow, canary and drift tests (HND-006).\n\n## Provenance\n\nREM-008 · HND-006 · AUD-012 (0.1) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M09": "# M09 — Eligibility router & canonical fallback\n\n## Responsibility\n\nHard eligibility (policy/region/features/qualification/health) before minimum-sufficient cost/latency selection; canonical auth/quota/model/region/schema/qualification/resource/no-route/user-action failure states with terminal human-review/no-AI paths; every rejected candidate reason auditable.\n\n## Acceptance criteria\n\n- WHEN candidates are filtered, THE SYSTEM SHALL record every rejected candidate's reason auditably, and cost SHALL NOT make an ineligible route eligible.\n- WHEN no eligible route exists, THE SYSTEM SHALL resolve to the canonical no-route/human-review/no-AI terminal — never a silent material route change.\n- WHEN AI is unavailable, THE SYSTEM SHALL never convert that into employee failure (journey tests).\n\n## Verification (required evidence)\n\nRouting, chaos, region, cost and employee-journey tests (HND-007); failure-injection tests (REM-010).\n\n## Provenance\n\nREM-009 · REM-010 · HND-007 · AUD-008 (0.15) · AUD-019 (0.3) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: A pinned model stays honoured only while eligible (AUD-008).", "M10": "# M10 — Complete inference lineage\n\n## Responsibility\n\nPersist actual implementation, connector, provider/operator, requested vs actual model, runtime, qualification profile, region, fallback decisions and review references on every material record.\n\n## Acceptance criteria\n\n- WHEN a material AI-assisted domain record is written, THE SYSTEM SHALL attach complete lineage — 100% coverage in the audit read-model (REM-011).\n\n## Verification (required evidence)\n\nData integration/audit and read-model tests (HND-008).\n\n## Provenance\n\nREM-011 · HND-008 · AUD-017 (0.4) · AUD-020 (0.0) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M11": "# M11 — Monorepo provider cutover\n\n## Responsibility\n\nFind and remove direct Anthropic/OpenAI/Gemini clients from project, PM-template, assistant and other services; route only through humanos-ai-client.\n\n## Acceptance criteria\n\n- WHEN the dependency scan runs, THE SYSTEM SHALL show no service outside approved connector modules importing provider config/SDK or sending provider HTTP requests.\n\n## Verification (required evidence)\n\nRepository dependency scan, contract tests and removal diff (REM-023).\n\n## Provenance\n\nREM-023 · HND-001 · AUD-001 (0.65) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M12": "# M12 — Codex read-only review wrapper\n\n## Responsibility\n\nApproved Codex CLI connector/wrapper (GPT-5.6 Sol/max) producing structured findings with exact model capture and NO write tools.\n\n## Acceptance criteria\n\n- WHEN Codex reviews plan/diff/test evidence, THE SYSTEM SHALL prevent any worktree modification or merge action (permission tests).\n- WHEN findings are produced, THE SYSTEM SHALL capture the exact model identity and structured finding schema; injection tests pass.\n\n## Verification (required evidence)\n\nPermission/injection/review tests (REM-012).\n\n## Provenance\n\nREM-012 · HND-009 · Claude-Codex Review Protocol sheet — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M13": "# M13 — Fable & Opus development task profiles\n\n## Responsibility\n\nSeparate planning/orchestration (Fable) and implementation (Opus) routes with exact-model preflight and work-package schemas.\n\n## Acceptance criteria\n\n- WHEN the Fable profile executes, THE SYSTEM SHALL refuse coding-write capabilities; WHEN the Opus profile executes, THE SYSTEM SHALL refuse self-review/merge capabilities (policy tests).\n\n## Verification (required evidence)\n\nWorkflow and policy tests (REM-013).\n\n## Provenance\n\nREM-013 · HND-009 · Development AI Workflow sheet — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M14": "# M14 — CI + named-human merge gate\n\n## Responsibility\n\nProtected-branch checks, CODEOWNERS and review state requiring deterministic CI, Codex blocker/major resolution and a named human approval.\n\n## Acceptance criteria\n\n- WHEN a merge to a protected branch is attempted, THE SYSTEM SHALL require deterministic CI, resolved Codex blockers/majors and a named human approval — no AI-only merge (repository control test).\n\n## Verification (required evidence)\n\nRepository control test (REM-014).\n\n## Provenance\n\nREM-014 · HND-009 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M15": "# M15 — Provider connectors (native + constrained compatible)\n\n## Responsibility\n\nNative OpenAI Responses connector split from the generic compatibility connector (capability probes: system/multiturn/tools/schema/embeddings/stream/cancel, actual operator recorded); hardened Anthropic connector (actual response model/route, sanitized errors, structured-output/effort manifest, provider-policy record).\n\n## Acceptance criteria\n\n- WHEN a connector lacks a probed capability, THE SYSTEM SHALL reject the feature before execution (conformance).\n- WHEN provider errors occur, THE SYSTEM SHALL keep sensitive provider bodies out of logs and record exact route/features.\n\n## Verification (required evidence)\n\nConnector conformance + privacy suites (REM-015..017).\n\n## Provenance\n\nREM-015 · REM-016 · REM-017 · AUD-013 (0.5) · AUD-014 (0.25) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M16": "# M16 — Provider health, budgets & circuit breaking\n\n## Responsibility\n\nHealth registry, quota/budget checks, retries, idempotency and circuit state feeding eligibility.\n\n## Acceptance criteria\n\n- WHEN a route is unhealthy or over budget, THE SYSTEM SHALL exclude it without weakening any policy guarantee (chaos/load tests).\n\n## Verification (required evidence)\n\nChaos/load tests (REM-018).\n\n## Provenance\n\nREM-018 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M17": "# M17 — Model catalogue endpoint security\n\n## Responsibility\n\nAuthenticate the internal registry endpoint or expose a minimised public catalogue.\n\n## Acceptance criteria\n\n- WHEN an unauthenticated caller queries the catalogue, THE SYSTEM SHALL NOT enumerate internal providers, prices or routes (API security test).\n\n## Verification (required evidence)\n\nAPI security test (REM-019).\n\n## Provenance\n\nREM-019 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M18": "# M18 — Durable audit ledger & quality feedback\n\n## Responsibility\n\nDurable outbox/reconciliation for mandatory audit fields plus reviewed quality/correction/override signals.\n\n## Acceptance criteria\n\n- WHEN the ledger is unavailable, THE SYSTEM SHALL NOT lose mandatory audit/quality events (outbox/reconciliation tests).\n\n## Verification (required evidence)\n\nOutbox/reconciliation tests (REM-020).\n\n## Provenance\n\nREM-020 · AUD-017 (0.4) — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M19": "# M19 — Qualification corpus & initial runs\n\n## Responsibility\n\nBuild HumanOS + development datasets; qualify Fable, Opus, Codex and initial production candidates; signed profiles and limitations — no global model approval.\n\n## Acceptance criteria\n\n- WHEN qualification runs complete, THE SYSTEM SHALL produce signed task×effort profiles with limitations, and SHALL NOT emit a global model approval.\n\n## Verification (required evidence)\n\nEvaluation report (REM-021). Corpus sign-off is OI-04.\n\n## Provenance\n\nREM-021 · HND-006 · OI-04 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n", "M20": "# M20 — Stage 12A assurance execution\n\n## Responsibility\n\nExecute the engineering side of the Stage 12A tracks — security, privacy, endpoint performance/compatibility, data reliability/DR, AI & evaluator evaluation, fairness, accessibility, user-journey validation, operational readiness, incident/stop controls — and assemble the gate evidence.\n\n## Acceptance criteria\n\n- WHEN the gate is convened, THE SYSTEM SHALL present per-track evidence rows mapped to the Stage 12A gate sheet; PASS or RESTRICT is a human decision this module cannot make (OI-03).\n\n## Verification (required evidence)\n\nConnector conformance and Stage 12A gate evidence (HND-010); per-track sheets.\n\n## Provenance\n\nHND-010 · Stage 12A Hardening Gate sheet · Security Hardening Plan · Privacy and DPIA Closure · Legal and Worker Consultation · Fairness and Accessibility Eval sheets — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: DPIA/legal/worker-consultation and pen-test close outside engineering (OI-03).", "M21": "# M21 — Standalone router decision spike\n\n## Responsibility\n\nBuild only if isolation/resilience/customer-deployment needs cannot be met by the central orchestrator; if built, the same contracts and portable profiles must pass.\n\n## Acceptance criteria\n\n- WHEN the CTO decision is recorded, THE SYSTEM SHALL either close this module as decision-evidence-only or open a build change-proposal via plan-change.\n\n## Verification (required evidence)\n\nArchitecture decision / conformance (REM-022).\n\n## Provenance\n\nREM-022 · ADR-P2 · OI-02 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: Blocked on OI-02 (CTO / Architecture).", "M22": "# M22 — Pilot protocol readiness\n\n## Responsibility\n\nPrepare the staged internal pilot per protocol — cohort/task matrix, metrics/thresholds, participant rights and support, issue/decision log — and record STOP/REBUILD/RESTRICT/MODIFY/LIMITED/PHASED/PROCEED.\n\n## Acceptance criteria\n\n- WHILE the Stage 12A gate has not passed or restricted, THE SYSTEM SHALL NOT start any real employee pilot.\n- WHEN the pilot runs, THE SYSTEM SHALL uphold participant rights (inspect/correct/dispute/appeal) and never let AI directly decide dismissal, pay, promotion, probation or discipline.\n\n## Verification (required evidence)\n\nPilot Results + Rollout Options and Decision sheets.\n\n## Provenance\n\nPilot Protocol · Pilot Cohort and Task Matrix · Pilot Metrics and Thresholds · Participant Rights and Support sheets · S03 next actions 5-6 — master workbook `01_MASTER/nessovo_humanos_work_intelligence_master_handoff_validated.xlsx` (see `registers/sources.md`).\n\nNote: Blocked on the Stage 12A gate outcome (M20, OI-03)."};
const SERVED = location.protocol !== 'file:';
const LSKEY = 'sdp-board:' + (PLAN.name || 'plan');
const TIER={0:'t0',1:'t1',2:'t2'};
const STATUS_OPTS=['draft','spec-approved','in-progress','implementation-verified','blocked-needs-decision','needs-revalidation','superseded'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mods=()=>(PLAN.modules||[]);
const STAGES=PLAN.stages||[];
const waveName=w=>{const s=STAGES.find(s=>String(s.wave)===String(w));return s&&s.name?s.name:'';};
const tc=()=>{const c=getComputedStyle(document.body);return {0:c.getPropertyValue('--t0').trim()||'#dc2626',1:c.getPropertyValue('--t1').trim()||'#d97706',2:c.getPropertyValue('--t2').trim()||'#16a34a'};};
let STATE={theme:'day',decisions:{},tracker:{}};
const trk=id=>(STATE.tracker[id]||{});
function trkState(m){const o=STATE.tracker[m.id]||{},w=m.workflow||{};const pick=(k,d)=>o[k]!==undefined?o[k]:d;
  return {status:o.status||m.status,wip:pick('wip',!!w.wip),impl:pick('impl',!!w.impl),verify:pick('verify',!!w.verify),review:pick('review',!!w.review),notes:pick('notes',m.tracker_notes||''),criteria:o.criteria||{}};}
const effStatus=m=>trkState(m).status;

/* ---------- cockpit ---------- */
/* review-gate visibility: a chip per module showing dual-review state (the #1 quality lever) */
function reviewObj(m){const r=m.review;return (r&&typeof r==='object'&&!Array.isArray(r))?r:null;}
function reviewChip(m){
  const ro=reviewObj(m); const verified=effStatus(m)==='implementation-verified';
  if(m.review_ok){const who=ro?[ro.reviewer,ro.reviewer_a,ro.reviewer_b].filter(Boolean).join('+'):'';
    if(m.review_deviation)
      return ` <span class="chip" style="background:var(--warn);color:#2a1a02" title="approved, but NOT by the planned reviewer family (planned: ${esc(m.reviewer||'?')}) — substituted reviewer, re-review queued">⚠ review: ${esc(who)} · planned ${esc(m.reviewer||'?')}</span>`;
    return ` <span class="chip" style="background:var(--ok);color:#05210f" title="recorded independent dual-review verdict">✓ review${who?': '+esc(who):''}</span>`;}
  if(Number(m.tier)===0&&verified)
    return ` <span class="chip" style="background:var(--bad);color:#2a0b0b" title="Tier-0 verified without a recorded dual-review verdict — review-gate FAIL">⚠ review missing</span>`;
  return '';
}
/* SPACE-style health scorecard — a balanced read of recorded plan state (NOT raw velocity).
   Reads PLAN.health from the engine; each pct card is green at 100, red below; openVerifyCount
   is green at 0, red otherwise. Guarded so a plan without a health block renders nothing. */
function healthCards(){
  const h=PLAN.health; if(!h||typeof h!=='object')return '';
  const pctCard=(label,v)=>{const n=Number(v)||0;const col=n>=100?'var(--ok)':'var(--bad)';
    return `<div class="card"><div class="n" style="color:${col}">${n}%</div><div class="l">${label}</div></div>`;};
  const countCard=(label,v)=>{const n=Number(v)||0;const col=n>0?'var(--bad)':'var(--ok)';
    return `<div class="card"><div class="n" style="color:${col}">${n}</div><div class="l">${label}</div></div>`;};
  // Risk-weighted overall score + the 4 dimensions (only present when the scorecard layer ran).
  // Scored as a graded dial: >=90 green, >=70 amber, else red — distinct from the binary pct cards.
  const scoreCard=(label,v)=>{const n=Number(v)||0;const col=n>=90?'var(--ok)':(n>=70?'var(--warn)':'var(--bad)');
    return `<div class="card"><div class="n" style="color:${col}">${n}${label==='Score'?'':'%'}</div><div class="l">${label}</div></div>`;};
  const dim=h.dimensions&&typeof h.dimensions==='object'?h.dimensions:null;
  const hasScore=typeof h.score==='number';
  const scoreRow=(hasScore||dim||h.qualityCoveragePct!=null||h.dorReadyPct!=null)?
    `<div class="l muted" style="margin-top:14px">Risk-weighted scorecard <span style="font-weight:400">· graded dials over leveled gate / maturity / DoR checks (≥90 green · ≥70 amber)</span></div>
     <div class="cards" style="margin-top:6px">
       ${hasScore?scoreCard('Score',h.score):''}
       ${dim?scoreCard('Verified',dim.verified):''}
       ${dim?scoreCard('Quality',dim.quality):''}
       ${dim?scoreCard('Coverage',dim.coverage):''}
       ${dim?scoreCard('Risk',dim.risk):''}
       ${h.qualityCoveragePct!=null?scoreCard('Quality coverage',h.qualityCoveragePct):''}
       ${h.dorReadyPct!=null?scoreCard('DoR ready',h.dorReadyPct):''}
     </div>`:'';
  return `<div class="l muted" style="margin-top:6px">Plan health <span style="font-weight:400">· balanced view of recorded state, not velocity</span></div>
   <div class="cards" style="margin-top:6px">
     ${pctCard('Verified',h.verifiedPct)}
     ${pctCard('T0 reviewed',h.tier0ReviewedPct)}
     ${pctCard('Gates passing',h.gatePassPct)}
     ${countCard('Open VERIFY items',h.openVerifyCount)}
   </div>${scoreRow}`;
}
/* Rule-exemptions panel (Cockpit). Reads PLAN.exemptions [{module,check,reason,by,expiry,active}].
   A row whose exemption is present but expired (active===false) is shown red — the underlying check
   is failing again. Guarded: no exemptions block -> renders nothing. */
function exemptionsPanel(){
  const ex=PLAN.exemptions; if(!Array.isArray(ex)||!ex.length)return '';
  const expired=ex.filter(e=>e&&e.active===false).length;
  return `<div class="panel" style="margin-top:18px"><h3>Rule exemptions <span class="muted">· ${ex.length}${expired?' · '+expired+' expired':''}</span></h3>
    <div class="muted" style="font-size:12px">Time-boxed waivers from a scorecard check (with reason + owner + expiry). Expired-but-present rows are red — the check now bites again; renew or remediate.</div>
    <table><thead><tr><th>Module</th><th>Check</th><th>Reason</th><th>By</th><th>Expiry</th><th>State</th></tr></thead><tbody>
    ${ex.map(e=>{const exp=e.active===false;const col=exp?'var(--bad)':'var(--ok)';
      return `<tr${exp?' style="color:var(--bad)"':''}><td><b>${esc(e.module)}</b></td><td><span class="gpill">${esc(e.check)}</span></td>
        <td>${esc(e.reason)||'<span class="muted">—</span>'}</td><td class="muted">${esc(e.by)||'—'}</td><td class="muted">${esc(e.expiry)||'—'}</td>
        <td><span class="status" style="border-color:${col};color:${col}">${exp?'expired':'active'}</span></td></tr>`;}).join('')}
    </tbody></table></div>`;
}
/* per-module complexity (passthrough from front-matter) as a small neutral chip; empty if unset */
function complexityChip(m){
  const c=m.complexity; if(c==null||c==='')return '';
  return ` <span class="chip cx" title="declared complexity">cx ${esc(c)}</span>`;
}
/* truth coverage from module satisfies[] (mirrors the engine's orphan-truth check) */
function truthCoverage(list,truths){
  const covered=new Set(); list.forEach(m=>(m.satisfies||[]).forEach(t=>covered.add(String(t).trim())));
  const orphans=truths.filter(g=>g.id&&!covered.has(String(g.id).trim()));
  return {covered,orphans};
}
function renderCockpit(el){
  const c=PLAN.counts||{tier:{},status:{},model:{}}; const t=c.tier||{}; const list=mods(); const total=list.length||1; const TT=tc();
  const qa=PLAN.planningQaChecks||[]; const qc=s=>qa.filter(q=>q.status===s).length;
  const verified=list.filter(m=>effStatus(m)==='implementation-verified').length;
  const active=list.filter(m=>{const x=trkState(m);return x.wip||x.impl;});
  const truths=PLAN.universalTruths||[];
  const t0v=list.filter(m=>Number(m.tier)===0&&effStatus(m)==='implementation-verified');
  const t0reviewed=t0v.filter(m=>m.review_ok).length;
  const {orphans}=truthCoverage(list,truths);
  const observations=Array.isArray(PLAN.observations)?PLAN.observations:[];
  const openObservations=observations.filter(o=>o.status==='open').length;
  const seg=(n,col)=>`<span style="width:${(n/total*100)}%;background:${col}"></span>`;
  el.innerHTML=`<div class="cards">
     <div class="card"><div class="n">${list.length}</div><div class="l">Modules</div></div>
     <div class="card"><div class="n">${t['0']||0}</div><div class="l">Tier 0</div></div>
     <div class="card"><div class="n">${active.length}</div><div class="l">In progress</div></div>
     <div class="card"><div class="n">${verified}/${list.length}</div><div class="l">Verified</div></div>
     <div class="card"><div class="n" style="color:${verified<list.length?'var(--bad)':'var(--ok)'}">${verified<list.length?'BLOCKED':'OPEN'}</div><div class="l">Build gate</div></div>
     <div class="card"><div class="n" style="color:${qc('fail')?'var(--bad)':'var(--ok)'}">${qc('pass')}/${qa.length}</div><div class="l">QA pass</div></div>
     <div class="card"><div class="n" style="color:${t0v.length&&t0reviewed<t0v.length?'var(--bad)':'var(--ok)'}">${t0reviewed}/${t0v.length}</div><div class="l">T0 dual-reviewed</div></div>
     <div class="card"><div class="n" style="color:${openObservations?'var(--warn)':'var(--ok)'}">${openObservations}</div><div class="l">Open observations</div></div>
   </div>

   <div class="l muted">Tier mix</div><div class="bar">${seg(t['0']||0,TT[0])}${seg(t['1']||0,TT[1])}${seg(t['2']||0,TT[2])}</div>

/* Lazy-load Mermaid from a CDN at most once. Resolves to the mermaid object, or rejects if it
   cannot be loaded (offline / file:// with no network / CDN blocked) — callers then keep the
   readable <pre> source as the fallback. */
let _mermaidP=null;
function loadMermaid(){
  if(window.mermaid)return Promise.resolve(window.mermaid);
  if(_mermaidP)return _mermaidP;
  _mermaidP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js';
    s.onload=()=>window.mermaid?res(window.mermaid):rej(new Error('mermaid missing'));
    s.onerror=()=>rej(new Error('mermaid CDN unavailable'));
    document.head.appendChild(s);
  });
  return _mermaidP;
}

function md(src){

  while(i<lines.length){const ln=lines[i];

    if(inPre){html+=esc(ln)+'\n';i++;continue;}
    if(ln.includes('|')&&i+1<lines.length&&/^\s*\|?[\s:|-]{3,}\|?\s*$/.test(lines[i+1])&&lines[i+1].includes('-')){closeUl();const head=cells(ln);i+=2;html+='<table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>';while(i<lines.length&&lines[i].includes('|')&&lines[i].trim()){html+='<tr>'+cells(lines[i]).map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>';i++;}html+='</tbody></table>';continue;}

/* ---------- activity log (client-side; the plugin records no run/build history) ---------- */

/* ---------- connections & reuse overlay (derive-don't-fabricate, from knowledgeModel) ---------- */
function renderConnections(el){
  const km=PLAN.knowledgeModel||{};const E=km.edges||[];const N=km.nodes||[];
  if(!E.length){el.innerHTML='<div class="empty">No connections yet — the knowledge model has no edges. Add depends_on / provides / shared resources to modules, then re-run --board.</div>';return;}
  const L={};N.forEach(n=>{L[n.id]={label:n.label||n.id,type:n.type};});
  const tname=t=>String(t).replace(/-/g,' ');
  // reuse hotspots: incoming-degree per target — a node many others point at is a shared service.
  const inc={};E.forEach(e=>{(inc[e.to]=inc[e.to]||{total:0,by:{}});inc[e.to].total++;inc[e.to].by[e.type]=(inc[e.to].by[e.type]||0)+1;});
  const hot=Object.entries(inc).map(([id,d])=>({id,total:d.total,by:d.by})).sort((a,b)=>b.total-a.total).slice(0,12);
  const types=[...new Set(E.map(e=>e.type))];

   <div class="muted" style="font-size:12px">Derived from the knowledge model — every edge comes from a module's declared depends_on / provides / shared resources (nothing fabricated). A node many others point at is a shared service; if a module consumes an edge, it should depend on that edge's owner.</div>
   <h3>Reuse hotspots <span class="muted">· most-referenced nodes</span></h3>
   <div class="legend" style="flex-wrap:wrap;gap:6px">${hot.length?hot.map(h=>`<span class="status" title="${esc(Object.entries(h.by).map(([t,n])=>tname(t)+' ×'+n).join(', '))}"><b>${esc((L[h.id]||{}).label||h.id)}</b> <span class="chip">${esc((L[h.id]||{}).type||'node')}</span> · ${h.total}</span>`).join(''):'<span class="muted">no shared references</span>'}</div>
   <h3>Edges <span class="muted">· ${E.length}</span></h3>
   <div class="legend" id="connFilters" style="gap:14px">${types.map(t=>`<label><input type="checkbox" class="connF" value="${esc(t)}" checked> ${esc(tname(t))}</label>`).join('')}</div>
   <table id="connTable"><thead><tr><th>From</th><th>Type</th><th>To</th><th>Provenance</th></tr></thead><tbody></tbody></table>`;
  const tb=el.querySelector('#connTable tbody');
  const drawRows=()=>{const on=new Set([...el.querySelectorAll('.connF:checked')].map(c=>c.value));
    tb.innerHTML=E.filter(e=>on.has(e.type)).map(e=>`<tr><td><b>${esc((L[e.from]||{}).label||e.from)}</b> <span class="muted">${esc(e.from)}</span></td><td><span class="status">${esc(tname(e.type))}</span></td><td>${esc((L[e.to]||{}).label||e.to)} <span class="muted">${esc(e.to)}</span></td><td class="muted">${esc(e.kind||'')}${e.via?(e.kind?' · ':'')+'via '+esc(e.via):''}${(!e.kind&&!e.via)?'declared':''}</td></tr>`).join('');};
  el.querySelectorAll('.connF').forEach(c=>c.onchange=drawRows);drawRows();
}

/* ---------- drag-to-PATCH kanban (writes status via /commit-module when served) ---------- */
function renderKanban(el){

  if(!document.getElementById('kanbanCss')){const st=document.createElement('style');st.id='kanbanCss';
    st.textContent='.kdrop{min-height:60px;padding:4px;border-radius:8px}.kdrop.kover{outline:2px dashed var(--accent);background:rgba(127,127,127,.08)}.kbm{cursor:grab}.kbm:active{cursor:grabbing}.kanban .kcol{min-width:190px}';
    document.head.appendChild(st);}
  const M=Object.fromEntries(list.map(m=>[m.id,m]));const TT=tc();const cols=STATUS_OPTS;
  const byStatus={};cols.forEach(s=>byStatus[s]=[]);const other=[];
  list.forEach(m=>{const s=effStatus(m);(byStatus[s]?byStatus[s]:other).push(m);});
  const card=m=>`<div class="mod kbm" draggable="true" data-id="${esc(m.id)}" style="border-left-color:${TT[m.tier]||'#64748b'}"><div class="id">${esc(m.id)} <span class="chip ${TIER[m.tier]||'tu'}" style="float:right">${m.tier==null?'—':'T'+esc(m.tier)}</span></div><div class="ti">${esc(m.title)}</div><div class="ti muted">${esc(m.model||'')}</div></div>`;
  el.innerHTML=`<h3 style="margin-top:0">Kanban <span class="muted">· drag a card to change its status${SERVED?' — writes status + workflow to the spec via /commit-module':' — saved in your browser (run server.js to write back to specs)'}</span></h3>
   <div class="wavecols kanban">${cols.map(s=>`<div class="wavecol kcol"><h3><span class="status ${esc(s)}">${esc(s)}</span> · <span data-count>${byStatus[s].length}</span></h3><div class="kdrop" data-kanban-col="${esc(s)}" data-status="${esc(s)}">${byStatus[s].map(card).join('')}</div></div>`).join('')}${other.length?`<div class="wavecol kcol"><h3 class="muted">other</h3><div class="kdrop" data-kanban-col="" data-status="">${other.map(card).join('')}</div></div>`:''}</div>`;
  let dragId=null;
  el.querySelectorAll('.kbm').forEach(c=>{c.ondragstart=e=>{dragId=c.dataset.id;try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(_){}};});
  el.querySelectorAll('.kdrop').forEach(d=>{
    d.ondragover=e=>{e.preventDefault();d.classList.add('kover');};
    d.ondragleave=()=>d.classList.remove('kover');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('kover');
      const id=dragId||(e.dataTransfer&&e.dataTransfer.getData('text/plain'));const to=d.dataset.status;if(!id||!to)return;
      const m=M[id];if(!m)return;const from=effStatus(m);if(from===to)return;
      const prev=STATE.tracker[id]||{};STATE.tracker[id]=Object.assign({},prev,{status:to});
      logStatusChange(id,from,to,'kanban');persist();
      if(SERVED){const w=trkState(m);fetch('/commit-module',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,file:m.file,status:to,workflow:{wip:w.wip,impl:w.impl,verify:w.verify,review:w.review},notes:w.notes||''})}).then(r=>r.json()).then(o=>flagSaved('↪ '+(o.file||'spec'))).catch(()=>flagSaved('commit failed — server.js?'));}
      draw();};
  });
}

/* ---------- pipeline cockpit (one pipe per group; five derived SDLC stages) ---------- */
/* Stage reached is DERIVED from recorded state only (status + workflow ticks + review verdict) —
   never hand-typed: Vision=authored · Spec=spec-approved · Build=in-progress/Impl ticked ·
   Test=Verify ticked or implementation-verified · Live=verified + independent review recorded. */
const SDLC=[
  {key:'vision',label:'Vision',back:'authored — a module spec exists'},
  {key:'spec',label:'Spec',back:'status spec-approved (G1)'},
  {key:'build',label:'Build',back:'status in-progress, or Impl ticked in the tracker'},
  {key:'test',label:'Test',back:'Verify ticked, or status implementation-verified'},
  {key:'live',label:'Live',back:'implementation-verified + independent review recorded'}];
function sdlcStageOf(m){
  const st=effStatus(m),w=trkState(m);
  if(st==='superseded')return 0;
  // Live demands a RECORDED approved review verdict (review: block) — never the tracker's
  // Review checkbox, which is a local tick anyone can set (finding: gate bypass).
  if(st==='implementation-verified')return m.review_ok?5:4;
  let s=1;
  if(st==='spec-approved'||st==='in-progress'||st==='blocked-needs-decision'||st==='needs-revalidation')s=2;
  if(st==='in-progress'||w.impl)s=Math.max(s,3);
  if(w.verify)s=Math.max(s,4);
  return s;
}
const sdlcStuck=m=>{const s=effStatus(m);return s==='blocked-needs-decision'||s==='needs-revalidation';};
function openSpecInTracker(id){
  active='modules';draw();
  setTimeout(()=>{const v=document.getElementById('view');
    const a=v.querySelector(`.speclink[data-spec="${CSS.escape(id)}"]`);
    if(a){a.onclick();const r=a.closest('tr');if(r)r.scrollIntoView({behavior:'smooth',block:'center'});}},0);
}
function renderPipelines(el){
  const all=mods();const list=all.filter(m=>sdlcStageOf(m)>0);
  if(!list.length){el.innerHTML='<div class="empty">No modules yet — decompose the plan (plan-decompose), then re-run <code>plan_lint.py --board</code>.</div>';return;}
  const superseded=all.length-list.length;const TT=tc();
  const GROUPS=PLAN.groups||[];let pipes=[];
  // null-prototype maps: a group/wave literally named "__proto__" or "constructor" must group,
  // not resolve an inherited property and crash the default tab (finding 14).
  if(GROUPS.length){
    const byG=Object.create(null);list.forEach(m=>{const g=m.group||'__none';(byG[g]=byG[g]||[]).push(m);});
    pipes=GROUPS.filter(g=>byG[g.id]).map(g=>({id:g.id,name:g.name||g.id,list:byG[g.id]}));
    if(byG.__none)pipes.push({id:'__none',name:'Ungrouped',list:byG.__none});
  }else{
    const byW=Object.create(null);list.forEach(m=>{const w=(m.wave==null?'—':m.wave);(byW[w]=byW[w]||[]).push(m);});
    pipes=Object.keys(byW).sort((a,b)=>(a==='—'?1e9:+a)-(b==='—'?1e9:+b)).map(w=>({id:'w'+w,name:'Wave '+w+(waveName(w)?' — '+waveName(w):''),list:byW[w]}));
  }
  if(pipes.length>1)pipes.unshift({id:'__all',name:'All modules',list});
  const stageCells=p=>SDLC.map((s,i)=>{
    const n=p.list.length,reached=p.list.filter(m=>sdlcStageOf(m)>=i+1).length,here=p.list.filter(m=>sdlcStageOf(m)===i+1);
    const pct=n?reached/n*100:0;const col=pct>=100?'var(--ok)':'var(--accent)';
    const names=here.slice(0,6).map(m=>m.id).join(', ')+(here.length>6?' +'+(here.length-6):'');
    return `<div class="stage" data-pipe="${esc(p.id)}" data-stage="${i+1}" title="${esc(s.back)}${here.length?' — here now: '+esc(names):''}">
      <div class="sfill" style="width:${pct}%;background:${col}"></div>
      ${here.length?`<span class="here">${here.length}</span>`:''}
      <div class="sl">${s.label}</div><div class="sn">${reached}/${n} reached</div></div>`;}).join('');
  const pipeRow=p=>{
    const t0=p.list.filter(m=>Number(m.tier)===0).length,stuck=p.list.filter(sdlcStuck).length;
    return `<div class="pipe" data-piperow="${esc(p.id)}">
      <div class="pname"><b data-pipename="${esc(p.id)}" title="show these modules on the Modules tab">${esc(p.name)}</b>
        <span class="x">${p.list.length} module${p.list.length===1?'':'s'}${t0?` · <span class="chip t0" style="font-size:10px">T0×${t0}</span>`:''}${stuck?` · <span style="color:var(--bad)">⚠ ${stuck} stuck</span>`:''}</span></div>
      ${stageCells(p)}</div><div class="pipedrawer" data-pipedrawer="${esc(p.id)}" style="display:none"></div>`;};
  const boardStamp=document.querySelector('meta[name="sdp-stamp"]')?.content||'unavailable';
  const guide=DOCS['board-guide.md']?`<details class="panel" open style="margin:0 0 14px"><summary style="cursor:pointer;font-weight:700">How to read this development board</summary><div class="doc" style="border:0;box-shadow:none;padding:0">${md(DOCS['board-guide.md'])}</div></details>`:'';
  el.innerHTML=`<h3 style="margin-top:0">Development pipeline board</h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px">Generated content stamp: <code>${esc(boardStamp)}</code>. This stamp identifies this board snapshot; it is not a Git commit, test receipt, runtime state, or release approval.</div>
    ${guide}
    <div class="muted" style="font-size:12px">Each pipe is a ${GROUPS.length?'module group':'wave'} moving through the five delivery stages. Everything is derived from recorded plan state — status, tracker ticks and review verdicts — nothing hand-typed. <b>Click a stage</b> to see the modules currently at it; click a pipe's name to open its modules.${superseded?` <span class="muted">(${superseded} superseded module${superseded===1?'':'s'} hidden.)</span>`:''}</div>
    <div class="pipewrap"><div class="pipehead"><div class="pname"></div>${SDLC.map(s=>`<div class="stg" title="${esc(s.back)}">${s.label}</div>`).join('')}</div>
    ${pipes.map(pipeRow).join('')}</div>`;
  const P=new Map(pipes.map(p=>[p.id,p]));
  el.querySelectorAll('.stage').forEach(c=>c.onclick=()=>{
    const p=P.get(c.dataset.pipe),si=+c.dataset.stage,dr=el.querySelector(`[data-pipedrawer="${CSS.escape(c.dataset.pipe)}"]`);
    if(!p)return;
    const here=p.list.filter(m=>sdlcStageOf(m)===si);
    const open=dr.style.display!=='none'&&dr.dataset.stage===String(si);
    if(open){dr.style.display='none';return;}
    dr.dataset.stage=String(si);dr.style.display='block';
    dr.innerHTML=`<b>${SDLC[si-1].label}</b> <span class="muted">· ${esc(SDLC[si-1].back)} · ${here.length} module${here.length===1?'':'s'} here</span>`+
      (here.length?here.map(m=>`<div class="gline"><span class="chip ${TIER[m.tier]||'tu'}">${m.tier==null?'—':'T'+esc(m.tier)}</span><b>${esc(m.id)}</b> ${esc(m.title)} <span class="status ${esc(effStatus(m))}">${esc(effStatus(m)||'—')}</span>${sdlcStuck(m)?'<span style="color:var(--bad)">⚠</span>':''}${m.review_deviation?'<span class="status" style="border-color:var(--warn);color:var(--warn)" title="approved by a different reviewer family than planned">⚠ reviewer swap</span>':''}<span class="speclink" data-open="${esc(m.id)}">open spec →</span></div>`).join(''):'<div class="muted" style="margin-top:4px">none here right now</div>');
    dr.querySelectorAll('[data-open]').forEach(a=>a.onclick=()=>openSpecInTracker(a.dataset.open));
  });
  el.querySelectorAll('[data-pipename]').forEach(b=>b.onclick=()=>{
    active='modules';draw();
    setTimeout(()=>{const gf=document.querySelector('[data-group-filter]');
      if(gf&&b.dataset.pipename!=='__all'&&b.dataset.pipename!=='__none'&&[...gf.options].some(o=>o.value===b.dataset.pipename)){gf.value=b.dataset.pipename;gf.onchange();}},0);
  });
}

/* General, domain-neutral document tabs (these are what plan_lint.py --init scaffolds). Any OTHER
   doc a project happens to add (e.g. a regulated project's compliance.md or sign-off.md) is picked up
   automatically by the generic fallback below and labelled from its filename — nothing domain-specific

Object.keys(DOCS).filter(k=>!known.has(k)&&!k.startsWith('observations/')&&!k.startsWith('skill-improvements/')).forEach((k,n)=>{const lbl=k.replace(/^registers\//,'').replace(/\.md$/,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());TABS.push(['x'+n,lbl,renderDoc(k)]);});
let active=TABS[0][0];const nav=document.getElementById('tabs');
try{const t=sessionStorage.getItem(LSKEY+':tab');if(t&&TABS.some(x=>x[0]===t))active=t;}catch(e){}
TABS.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>{active=id;draw()};nav.appendChild(b);});
function draw(){[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.id===active));try{sessionStorage.setItem(LSKEY+':tab',active);}catch(e){}const fn=(TABS.find(t=>t[0]===active)||TABS[0])[2];const v=document.getElementById('view');v.innerHTML='';fn(v);}
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('wizBtn').onclick=openWizard;
document.getElementById('mClose').onclick=closeWizard;
modal.onclick=e=>{if(e.target===modal)closeWizard();};

/* live mode: poll /status; when a regen lands, reload in place. Staleness is judged by the
   GENERATION STAMP baked into this document at generation time vs the stamp of the file the
   server is currently serving — immune to the mtime race where a regen lands between page
   load and the first poll (finding 18). mtime is the fallback for older server.js pairings.
   The served-from dir is shown in the header so a stale or wrong-workspace tab is self-evident. */
let BOARD_MTIME=null;
const MY_STAMP=(document.querySelector('meta[name="sdp-stamp"]')||{}).content||'';
const HAVE_STAMP=MY_STAMP&&MY_STAMP.indexOf('__')!==0; // unreplaced token -> stamp unusable
function _stale(s){
  if(!s)return false;
  if(HAVE_STAMP&&s.boardStamp)return s.boardStamp!==MY_STAMP;
  return !!(BOARD_MTIME&&s.boardMtime&&s.boardMtime!==BOARD_MTIME);
}
function _maybeReload(){
  // ONE reload path for initial + polled staleness: always honour the focused-input guard
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='TEXTAREA'||ae.tagName==='INPUT'||ae.tagName==='SELECT')){flagSaved('↻ plan changed — will reload when you finish typing');return;}
  flagSaved('↻ plan changed — reloading…');setTimeout(()=>location.reload(),400);
}
function watchLive(){
  fetch('/status').then(r=>r.json()).then(s=>{
    if(s&&s.servedFrom){const sub=document.getElementById('planSub');
      if(!/served from/.test(sub.textContent))sub.textContent+=' · live · served from '+s.servedFrom;}
    BOARD_MTIME=s&&s.boardMtime;
    if(_stale(s))_maybeReload();
    setInterval(()=>{fetch('/status').then(r=>r.json()).then(s2=>{if(_stale(s2))_maybeReload();}).catch(()=>{});},3000);
  }).catch(()=>{});
}
function boot(){loadLocal();applyTheme();draw();
  if(SERVED){fetch('/overrides').then(r=>r.json()).then(o=>{if(o&&typeof o==='object'){if(o.decisions)STATE.decisions=Object.assign({},o.decisions,STATE.decisions);if(o.tracker)STATE.tracker=Object.assign({},o.tracker,STATE.tracker);if(Array.isArray(o.activity)&&o.activity.length>(STATE.activity||[]).length)STATE.activity=o.activity;if(o.theme&&!localStorage.getItem(LSKEY)){STATE.theme=o.theme;applyTheme();}draw();}}).catch(()=>{});watchLive();}
  else{const sub=document.getElementById('planSub');sub.textContent+=' · static file — run server.js for live mode';}}
boot();
</script>
