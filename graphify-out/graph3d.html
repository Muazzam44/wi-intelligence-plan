<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Knowledge Graph — 3D</title>
  <!-- Served from graphify-out/ next to plan-graph.json (generated by scripts/graph_export.py,
       which plan_lint.py --board runs automatically). Serve via serve_all.py -> :4174/graph3d.html.
       The 3D engine loads from a CDN; offline, the page degrades to a readable hubs/communities list. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3; font: 13px/1.5 system-ui, Segoe UI, sans-serif; overflow: hidden; }
    #graph { position: fixed; inset: 0; }
    #labelLayer { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .glabel { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 11px; color: #e6edf3; background: rgba(13,17,23,0.72); border: 1px solid #30363d; border-radius: 4px; padding: 1px 5px; transform: translate(-50%, -50%); }
    .glabel.hub { color: #8b949e; background: rgba(13,17,23,0.5); }
    .card { position: fixed; z-index: 10; background: #161b22ee; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); max-height: 70vh; overflow: auto; }
    #info { top: 12px; left: 12px; max-width: 330px; }
    #detail { top: 12px; right: 12px; max-width: 360px; display: none; }
    #controls { bottom: 12px; left: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; max-width: calc(100vw - 24px); }
    h1 { font-size: 14px; margin: 0 0 6px; }
    code { color: #79c0ff; font-size: 12px; word-break: break-all; }
    .muted { color: #8b949e; }
    .cchip { display: inline-flex; align-items: center; gap: 5px; margin: 2px 6px 2px 0; font-size: 11px; cursor: pointer; }
    .cchip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .cchip.off { opacity: .35; }
    input[type=search] { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 5px 8px; width: 170px; font: inherit; }
    button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>
<body>
  <div id="graph"></div>
  <div id="labelLayer"></div>
  <div id="info" class="card"><h1>Loading plan graph…</h1></div>
  <div id="detail" class="card"></div>
  <div id="controls" class="card">
    <input id="search" type="search" placeholder="find a node…" />
    <button id="hublabels">hub labels: off</button>
    <label class="muted" style="display:flex;align-items:center;gap:5px">links <input id="linkop" type="range" min="0" max="100" value="22" style="width:90px"></label>
    <button id="fit">fit all</button>
    <span class="muted">hover = isolate connections · click = focus · community chips filter</span>
  </div>
  <script>
    const PALETTE = ['#58a6ff','#3fb950','#d29922','#f85149','#bc8cff','#39c5cf','#ff7b72','#7ee787','#ffa657','#d2a8ff','#79c0ff','#56d364','#e3b341','#ff9bce','#a5d6ff','#ffa198'];
    // escape quotes too — community/group names land in attribute values (data-comm="…"),
    // where an unescaped quote becomes an executable event-handler attribute (finding 2)
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const layer = document.getElementById('labelLayer');
    const DIM_NODE = 'rgba(110,118,129,0.10)';
    let Graph, NODES = [], LINKS = [], COLOR = () => '#888', adj = null, hubLabels = false, linkBaseOp = 0.22;
    const hlNodes = new Set(), hlLinks = new Set(), offComms = new Set();
    let hoverId = null, pinId = null;
    const labelDivs = new Map();
    let COMMS = [];
    const commColor = c => PALETTE[Math.abs(COMMS.indexOf(c)) % PALETTE.length];

    fetch('plan-graph.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(g => {
      const nodeIds = new Set((g.nodes || []).map(n => n.id));
      LINKS = (g.edges || g.links || [])
        .map(e => ({ source: (e.source && e.source.id) || e.source, target: (e.target && e.target.id) || e.target, relation: e.relation }))
        .filter(l => nodeIds.has(l.source) && nodeIds.has(l.target) && l.source !== l.target);
      const deg = {};
      LINKS.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
      NODES = (g.nodes || []).map(n => ({ id: n.id, label: n.label || n.id, type: n.type, community: n.community != null ? String(n.community) : (n.type || '?'), summary: n.summary, source_file: n.source_file, status: n.status, tier: n.tier, deg: deg[n.id] || 0 }));
      COMMS = (g.metadata && g.metadata.communities) || [...new Set(NODES.map(n => n.community))].sort();
      COLOR = n => commColor(n.community);
      const byDeg = [...NODES].sort((a, b) => b.deg - a.deg);
      const chips = COMMS.map(c => `<span class="cchip" data-comm="${esc(c)}"><i style="background:${commColor(c)}"></i>${esc(c)}</span>`).join('');
      document.getElementById('info').innerHTML =
        `<h1>${esc((g.metadata && g.metadata.plan) || 'Plan')} — knowledge graph</h1>${NODES.length} nodes · ${LINKS.length} edges · ${COMMS.length} communities` +
        `<div style="margin-top:6px">${chips}</div>` +
        `<div class="muted" style="margin-top:6px">Node size = connections (hubs are god-nodes). Top hubs:</div>` +
        byDeg.slice(0, 6).map(n => `<div>• ${esc(n.label).slice(0, 44)} <span class="muted">(${n.deg})</span></div>`).join('');
      document.querySelectorAll('.cchip').forEach(ch => ch.onclick = () => {
        const c = ch.dataset.comm;
        if (offComms.has(c)) { offComms.delete(c); ch.classList.remove('off'); } else { offComms.add(c); ch.classList.add('off'); }
        applyCommunityFilter();
      });

      if (typeof ForceGraph3D === 'undefined') { fallbackList(byDeg); return; }
      Graph = ForceGraph3D()(document.getElementById('graph'))
        .graphData({ nodes: NODES, links: LINKS })
        .nodeLabel(n => `${esc(n.label)} — ${esc(n.type || '')} · ${esc(n.community)} · deg ${n.deg}`)
        .nodeVal(n => Math.min(12, 2 + Math.sqrt(n.deg)))
        .nodeRelSize(3)
        .nodeColor(nodeColor)
        .nodeOpacity(0.92)
        .linkColor(linkColor)
        .linkWidth(linkWidth)
        .backgroundColor('#0d1117')
        .warmupTicks(60)
        .cooldownTicks(160)
        .onNodeHover(n => { if (!pinId) setFocus(n ? n.id : null); })
        .onNodeClick(n => { pinId = (pinId === n.id ? null : n.id); setFocus(pinId || n.id); flyTo(n); showDetail(n, COLOR(n)); })
        .onBackgroundClick(() => { pinId = null; setFocus(null); document.getElementById('detail').style.display = 'none'; })
        .onEngineStop(() => { try { Graph.zoomToFit(700, 80); } catch (e) {} });
      Graph.d3Force('charge').strength(-130);
      Graph.d3Force('link').distance(30);
      window.GRAPH = Graph;
      setTimeout(() => { try { Graph.zoomToFit(800, 80); } catch (e) {} }, 4000);
      setInterval(updateLabels, 120);
    }).catch(e => {
      document.getElementById('info').innerHTML = '<h1>Failed to load plan-graph.json</h1>' +
        '<span class="muted">' + esc(String(e)) + '</span>' +
        '<p class="muted">Generate it with <code>python scripts/plan_lint.py --board &lt;repo&gt;/plan</code> (or <code>graph_export.py</code>), and open this page over HTTP — <code>python scripts/serve_all.py &lt;repo&gt;/plan</code> serves it on the graph port.</p>';
    });

    // Offline / no-CDN fallback: still useful — communities + full hub list, no 3D.
    function fallbackList(byDeg) {
      const el = document.getElementById('graph');
      el.style.overflow = 'auto';
      el.innerHTML = `<div style="max-width:720px;margin:90px auto 40px;padding:0 16px">
        <h1>3D engine unavailable (offline or CDN blocked)</h1>
        <p class="muted">The graph data itself loaded fine. Top 40 hubs by connections:</p>` +
        byDeg.slice(0, 40).map(n => `<div style="padding:3px 0;border-bottom:1px solid #21262d"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COLOR(n)};margin-right:7px"></i>${esc(n.label)} <span class="muted">· ${esc(n.type)} · ${esc(n.community)} · ${n.deg} connections</span></div>`).join('') +
        `</div>`;
    }

    function applyCommunityFilter() {
      if (!Graph) return;
      const nodes = NODES.filter(n => !offComms.has(n.community));
      const keep = new Set(nodes.map(n => n.id));
      const links = LINKS.filter(l => keep.has((l.source && l.source.id) || l.source) && keep.has((l.target && l.target.id) || l.target));
      adj = null; hlNodes.clear(); hlLinks.clear(); hoverId = null; pinId = null;
      Graph.graphData({ nodes, links });
    }

    function buildAdj() {
      adj = new Map();
      for (const l of Graph.graphData().links) {
        const s = (l.source && l.source.id) || l.source, t = (l.target && l.target.id) || l.target;
        if (!adj.has(s)) adj.set(s, { nb: new Set(), links: [] });
        if (!adj.has(t)) adj.set(t, { nb: new Set(), links: [] });
        adj.get(s).nb.add(t); adj.get(s).links.push(l);
        adj.get(t).nb.add(s); adj.get(t).links.push(l);
      }
    }
    function setFocus(id) {
      if (!adj) buildAdj();
      hlNodes.clear(); hlLinks.clear(); hoverId = id;
      if (id) { hlNodes.add(id); const a = adj.get(id); if (a) { a.nb.forEach(x => hlNodes.add(x)); a.links.forEach(l => hlLinks.add(l)); } }
      Graph.nodeColor(nodeColor).linkColor(linkColor).linkWidth(linkWidth);
    }
    const nodeColor = n => hoverId ? (hlNodes.has(n.id) ? COLOR(n) : DIM_NODE) : COLOR(n);
    const linkColor = l => hlLinks.has(l) ? 'rgba(88,166,255,0.95)' : (hoverId ? 'rgba(110,118,129,0.03)' : `rgba(160,170,190,${linkBaseOp})`);
    const linkWidth = l => hlLinks.has(l) ? 1.8 : (0.3 + linkBaseOp * 1.8);

    let HUBS = [];
    function updateLabels() {
      const G = window.GRAPH; if (!G || typeof G.graph2ScreenCoords !== 'function') return;
      const nodes = G.graphData().nodes;
      if (HUBS.length !== nodes.length) HUBS = [...nodes].sort((a, b) => (b.deg || 0) - (a.deg || 0));
      let show;
      if (hoverId) show = nodes.filter(n => hlNodes.has(n.id));
      else show = hubLabels ? HUBS.slice(0, 40) : [];
      const active = new Set(), focused = !!hoverId;
      for (const n of show) {
        if (n.x == null) continue;
        const c = G.graph2ScreenCoords(n.x, n.y, n.z); if (!c) continue;
        let div = labelDivs.get(n.id);
        if (!div) { const lab = String(n.label || n.id); div = document.createElement('div'); div.textContent = lab.length > 44 ? lab.slice(0, 42) + '…' : lab; layer.appendChild(div); labelDivs.set(n.id, div); }
        div.className = 'glabel' + (focused && n.id !== hoverId ? ' hub' : '');
        const on = c.x >= -50 && c.y >= -20 && c.x <= innerWidth + 50 && c.y <= innerHeight + 20;
        div.style.display = on ? 'block' : 'none';
        if (on) div.style.transform = `translate(-50%,-50%) translate(${c.x}px,${c.y}px)`;
        active.add(n.id);
      }
      for (const [id, div] of labelDivs) if (!active.has(id)) div.style.display = 'none';
    }

    function flyTo(n) { const r = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 1, k = 1 + 110 / r; Graph.cameraPosition({ x: (n.x || 0) * k, y: (n.y || 0) * k, z: (n.z || 0) * k }, n, 900); }
    function showDetail(n, color) {
      const a = adj && adj.get(n.id); const nbCount = a ? a.nb.size : n.deg;
      const d = document.getElementById('detail'); d.style.display = 'block';
      d.innerHTML = `<h1 style="color:${color}">${esc(n.label)}</h1>` +
        `<div class="muted">${esc(n.type || '')} · ${esc(n.community)} · ${nbCount} connections${n.status ? ' · ' + esc(n.status) : ''}${n.tier != null ? ' · T' + esc(n.tier) : ''}</div>` +
        (n.source_file ? `<div style="margin-top:6px"><code>${esc(n.source_file)}</code></div>` : '') +
        (n.summary ? `<p>${esc(n.summary)}</p>` : '') +
        `<div class="muted" style="margin-top:6px">${pinId === n.id ? 'pinned — click background to release' : ''}</div>` +
        `<button onclick="document.getElementById('detail').style.display='none'">close</button>`;
    }
    document.getElementById('fit').onclick = () => Graph && Graph.zoomToFit(700, 80);
    document.getElementById('linkop').oninput = e => { linkBaseOp = (+e.target.value) / 100; if (Graph) Graph.linkColor(linkColor).linkWidth(linkWidth); };
    document.getElementById('hublabels').onclick = () => { hubLabels = !hubLabels; document.getElementById('hublabels').textContent = 'hub labels: ' + (hubLabels ? 'on' : 'off'); };
    document.getElementById('search').addEventListener('change', e => {
      const q = e.target.value.toLowerCase().trim(); if (!q || !Graph) return;
      const hit = (Graph.graphData().nodes).find(n => (n.label || '').toLowerCase().includes(q) || String(n.id).toLowerCase().includes(q));
      if (hit) { pinId = hit.id; setFocus(hit.id); flyTo(hit); showDetail(hit, COLOR(hit)); }
    });
  </script>
</body>
</html>
